<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#0a0c0d;--ink:#f2ede3;--mut:#a39e90;--gold:#d9bb7f;--r:#e0584f;--y:#e9b949;--g:#3da57f;--b:#4b82d9;--k:#2b2b33}

.brand p{color:var(--mut);letter-spacing:.32em;font-size:11px;margin-top:8px}

.cur{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c)}

<script src="https://cdn.ably.com/lib/ably.min-3.js"></script>
<script type="module">
const $=s=>document.querySelector(s),app=$('#app');
const lab=v=>({S:'⊘',R:'⇄',D:'+2',W:'✦',F:'+4'}[v]||v);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CN={r:'Merah',y:'Kuning',g:'Hijau',b:'Biru'};
// ====== ISI DENGAN API KEY ABLY KAMU ======
const ABLY_KEY='1T0blg.woYYRA:u5l0dTBwnVg9Sz7vgrwTUeHcIrtAFufVq21zR53vBVU';
// ==========================================
const S={code:null,slot:null,room:null,pick:null,v:0,dl:0,dur:30,seen:null,uno:0,gn:0,np:1,hide:0,lr:-1,host:false,R:null,rt:null,ch:null,gh:null,lob:null,matched:false,jres:null,hostCid:null};
const CID=localStorage.v_cid||(localStorage.v_cid=Math.random().toString(36).slice(2,10));

// ===== Mesin game (dijalankan di browser pemilik room) =====
const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',rc=()=>Array.from({length:4},()=>AL[Math.random()*AL.length|0]).join('');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const mkDeck=()=>{const d=[];for(const c of'rygb'){d.push(c+'0');for(let v=1;v<=9;v++)d.push(c+v,c+v);for(const s of'SRD')d.push(c+s,c+s)}for(let i=0;i<4;i++)d.push('kW','kF');return shuffle(d)};
const fail=m=>{throw new Error(m)};
function setTurn(g){const h=g['h'+g.turn],t=g.disc[g.disc.length-1];g.dur=h.some(c=>c[0]==='k'||c[0]===g.color||c[1]===t[1])?30:10;g.dl=Date.now()+g.dur*1000}
function startRound(R){
  const n=R.hand,d=mkDeck(),h0=d.splice(0,n),h1=d.splice(0,n);
  const top=d.splice(d.findIndex(c=>c[0]!=='k'&&/\d/.test(c[1])),1)[0],r=(R.g?.r||0)+1;
  R.status='playing';
  R.g={deck:d,disc:[top],h0,h1,color:top[0],turn:r%2?0:1,r,n:(R.g?.n||0)+1,uno:R.g?.uno||0,k:'s',by:-1,msg:'Ronde '+r+' dimulai'};
  setTurn(R.g);R.p[0].ready=R.p[1].ready=false}
function take(g,pl,n){const h=g['h'+pl];
  for(let k=0;k<n;k++){if(!g.deck.length){const t=g.disc.pop();g.deck=shuffle(g.disc);g.disc=[t];if(!g.deck.length)break}h.push(g.deck.pop())}}
function auto(R){const g=R.g,pl=g.turn;take(g,pl,1);g.turn=1-pl;g.n++;g.k='t';g.by=pl;g.msg=R.p[pl].n+' kehabisan waktu — kartu diambil otomatis';setTurn(g)}
function hplay(R,me,b){
  const g=R.g,op=1-me;if(R.status!=='playing'||g.turn!==me)fail('Bukan giliranmu');
  const h=g['h'+me],i=+b.i,c=h[i],top=g.disc[g.disc.length-1];
  if(!c)fail('Kartu tidak ada');
  if(!(c[0]==='k'||c[0]===g.color||c[1]===top[1]))fail('Kartu tidak cocok');
  if(c[0]==='k'&&!CN[b.col])fail('Pilih warna dulu');
  h.splice(i,1);g.disc.push(c);g.color=c[0]==='k'?b.col:c[0];
  const nm=R.p[me].n,on=R.p[op].n,v=c[1];let next=op,m=`${nm} main ${lab(v)}`;
  if(v==='S'||v==='R'){next=me;m+=` — ${on} dilewati`}
  if(v==='D'){take(g,op,2);next=me;m+=` — ${on} ambil 2`}
  if(v==='F'){take(g,op,4);next=me;m+=` — ${on} ambil 4`}
  if(c[0]==='k')m+=` (${CN[b.col]})`;
  g.turn=next;g.msg=m;g.n++;g.k='p';g.by=me;
  if(h.length<=1)g.uno=(g.uno||0)+1;
  if(!h.length){g.win=me;g.msg=nm+' kehabisan kartu';R.status='over';R.p[me].w++}else setTurn(g)}
function mkView(R,me){
  const o={status:R.status,hand:R.hand,v:R.v,rand:!!R.rand,p:{}};
  for(const i of[0,1])if(R.p[i])o.p[i]={n:R.p[i].n,ready:R.p[i].ready,w:R.p[i].w};
  const g=R.g,op=1-me;
  if(g){o.g={disc:[g.disc[g.disc.length-1]],color:g.color,turn:g.turn,msg:g.msg,win:g.win,r:g.r,n:g.n,k:g.k,by:g.by,uno:g.uno,dur:g.dur,left:g.dl-Date.now(),nd:g.deck.length,h:[...g['h'+me]],no:g['h'+op].length};
    if(R.status==='over')o.g.oh=[...g['h'+op]]}
  return o}
function bcast(){const R=S.R;if(!R)return;R.v++;apply(mkView(R,0));if(R.p[1]&&S.gh)S.gh.publish('view',{to:R.p[1].cid,from:CID,d:mkView(R,1)})}
function hostAct(me,b){
  const R=S.R;if(!R)return;
  try{const A=b.act;
    if(A==='hand'){const n=+b.n;if(me===0&&R.status==='lobby'&&n>=5&&n<=10)R.hand=n}
    else if(A==='ready'){if(R.status==='lobby'&&R.p[1]){R.p[me].ready=!R.p[me].ready;if(R.p[0].ready&&R.p[1].ready)startRound(R)}}
    else if(A==='play')hplay(R,me,b);
    else if(A==='draw'){const g=R.g;if(R.status==='playing'&&g.turn===me){take(g,me,1);g.turn=1-me;g.msg=R.p[me].n+' mengambil kartu';g.n++;g.k='d';g.by=me;setTurn(g)}}
    else if(A==='next'){if(me===0&&R.status==='over')startRound(R)}
    else if(A==='leave'&&me===1&&R.status==='lobby'){delete R.p[1];R.p[0].w=0;R.p[0].ready=false;delete R.g}
    else if(A==='lobby'){if(R.status!=='lobby'){R.status='lobby';R.p[0].ready=false;if(R.p[1])R.p[1].ready=false}}
  }catch(e){}
  bcast()}
function onJoin(m){
  const d=m.data,R=S.R;if(!R)return;
  if(R.p[1]&&R.p[1].cid!==d.cid)return S.gh.publish('deny',{to:d.cid,m:'Room sudah penuh'});
  if(!R.p[1]){if(R.status!=='lobby')return S.gh.publish('deny',{to:d.cid,m:'Room sedang main'});
    R.p[1]={n:d.name,cid:d.cid,ready:false,w:0};if(R.rand)startRound(R)}
  bcast()}

// ===== Jaringan (Ably) =====
const go=async b=>{if(S.host)hostAct(0,b);else await S.ch.publish('act',{cid:CID,...b})};
const connect=()=>{if(S.rt)return;
  S.rt=AblyPubSub.createClient({key:ABLY_KEY,clientId:CID});
  S.rt.connection.on(c=>{console.log('ably',c.current,c.reason&&c.reason.message);
    if(c.current==='failed'||c.current==='suspended')toast('Koneksi Ably '+c.current+(c.reason?': '+c.reason.message:''))})};
function cleanup(){
  for(const c of[S.ch,S.gh])if(c){c.unsubscribe();c.presence.unsubscribe();c.detach().catch(()=>{})}
  S.ch=S.gh=null;S.R=null;S.host=false;S.code=null;S.room=null;S.jres=null}
async function hostRoom(name,rand){
  connect();const code=rc();
  S.R={status:'lobby',hand:7,rand:!!rand,v:0,p:{0:{n:name,ready:false,w:0}}};
  S.host=true;S.slot=0;S.code=code;S.ch=S.rt.channels.get('h:'+code);S.gh=S.rt.channels.get('g:'+code);
  await S.ch.subscribe('join',onJoin);
  await S.ch.subscribe('act',m=>{if(S.R?.p[1]&&m.data.cid===S.R.p[1].cid)hostAct(1,m.data)});
  S.ch.presence.subscribe('leave',m=>{const R=S.R;if(R?.p[1]&&m.clientId===R.p[1].cid&&R.status==='lobby'){delete R.p[1];R.p[0].w=0;R.p[0].ready=false;delete R.g;bcast()}});
  S.ch.presence.enter({role:'host'}).catch(()=>{})}
async function joinRoom(code,name){
  connect();code=code.toUpperCase();S.host=false;S.slot=1;S.code=code;S.last=Date.now();
  S.ch=S.rt.channels.get('h:'+code);S.gh=S.rt.channels.get('g:'+code);
  const first=new Promise((ok,no)=>{S.jres={ok,no}});
  await S.gh.subscribe('view',m=>{if(m.data.to!==CID)return;S.hostCid=m.data.from;S.last=Date.now();apply(m.data.d);S.jres?.ok()});
  await S.gh.subscribe('deny',m=>{if(m.data.to===CID)S.jres?.no(new Error(m.data.m))});
  await S.gh.subscribe('closed',()=>roomClosed());
  await S.gh.subscribe('hb',()=>{S.last=Date.now()});
  S.ch.presence.subscribe('leave',m=>{if(S.hostCid&&m.clientId===S.hostCid)roomClosed()}).catch(()=>{});
  S.ch.presence.enter({role:'guest'}).catch(()=>{});
  const hello=()=>S.ch&&S.ch.publish('join',{cid:CID,name}).catch(()=>{});
  await S.ch.publish('join',{cid:CID,name});
  const retry=setTimeout(hello,2500);
  try{await Promise.race([first,new Promise((_,no)=>setTimeout(()=>no(new Error('Room tidak ditemukan atau pemiliknya sudah keluar')),7000))])}
  finally{clearTimeout(retry)}}
function begin(showCode){S.v=0;S.seen=null;S.hide=0;if(showCode)history.pushState(0,'','/r/'+S.code);S.host?bcast():view()}
function roomClosed(){if(!S.code)return;toast('Pemilik room keluar, room ditutup');leave(true)}
async function stopSeek(){S.matched=true;const L=S.lob;S.lob=null;if(L){L.unsubscribe();L.presence.unsubscribe();await L.presence.leave().catch(()=>{});L.detach().catch(()=>{})}}
async function seek(n){
  connect();const L=S.lob=S.rt.channels.get('v-lobby');S.matched=false;
  await L.subscribe('invite',async m=>{
    if(m.data.to!==CID||S.matched)return;S.matched=true;
    try{await stopSeek();await joinRoom(m.data.code,n);begin(false)}catch(e){cleanup();home();toast(e.message)}});
  const tryMatch=async()=>{
    if(S.matched||!S.lob)return;
    const mem=(await L.presence.get()).filter(x=>x.data?.seek).sort((a,b)=>a.clientId<b.clientId?-1:1);
    const i=mem.findIndex(x=>x.clientId===CID);if(i<0||i%2||!mem[i+1])return;
    S.matched=true;
    try{await hostRoom(n,true);await L.publish('invite',{to:mem[i+1].clientId,code:S.code});await stopSeek();begin(false)}catch(e){cleanup();home();toast(e.message)}};
  L.presence.subscribe('enter',tryMatch);L.presence.subscribe('leave',tryMatch);
  await L.presence.enter({seek:1});tryMatch()}

let AC,MG,MU,sil,mute=localStorage.v_mute==='1',mus=0,bi=0;
const ac=()=>{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=mute?0:1.6;
  const cp=AC.createDynamicsCompressor();MG.connect(cp);cp.connect(AC.destination);MU=AC.createGain();MU.gain.value=.5;MU.connect(MG)}
  if(AC.state!=='running')AC.resume().catch(()=>{});return AC};
function tn(f,d,type='sine',v=.1,w=0,dest){const a=ac();if(a.state!=='running')return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+w;
  o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(dest||MG);o.start(t);o.stop(t+d+.05)}
const CH=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]];
function silentWav(){const n=8000,b=new DataView(new ArrayBuffer(44+n)),w=(o,s)=>[...s].forEach((c,i)=>b.setUint8(o+i,c.charCodeAt()));
  w(0,'RIFF');b.setUint32(4,36+n,true);w(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);b.setUint32(24,8000,true);b.setUint32(28,8000,true);b.setUint16(32,1,true);b.setUint16(34,8,true);w(36,'data');b.setUint32(40,n,true);
  for(let i=0;i<n;i++)b.setUint8(44+i,128);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function unlock(){ac();
  if(!sil){sil=new Audio(silentWav());sil.loop=true;sil.setAttribute('playsinline','')}
  if(sil.paused)sil.play().catch(()=>{});

function shout(){if(mute||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance('UNO!');u.pitch=1.5;u.rate=1.1;u.volume=1;u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}
function flash(){const d=document.createElement('div');d.className='uf';d.textContent='UNO!';document.body.append(d);setTimeout(()=>d.remove(),1300)}
function sfx(k){if(mute&&k!=='uno')return;if(!mute)ac();
  ({card(){tn(520,.12,'triangle',.4);tn(780,.14,'sine',.25,.03)},
   draw(){tn(300,.16,'sawtooth',.14);tn(210,.18,'sawtooth',.14,.07)},
   tick(){tn(1000,.06,'square',.09)},hot(){tn(1500,.08,'square',.14)},
   join(){tn(660,.22,'sine',.3);tn(880,.28,'sine',.25,.12)},
   win(){[[0,.28],[.3,.28],[.6,1.3]].forEach(([w,d],i)=>{const ch=i<2?[261.6,329.6,392]:[523.3,659.3,784,1046.5];ch.forEach(f=>{tn(f,d,'sawtooth',.16,w);tn(f/2,d,'square',.1,w)})});setTimeout(shout,1100)},
   lose(){[[392,0],[370,.4],[349,.8],[311,1.2]].forEach(([f,w],i)=>tn(f,i<3?.38:.9,'sawtooth',.2,w))},

function play(i,col){
  const R=S.room,g=R.g,me=S.slot,c=(g['h'+me]||[])[i],top=g.disc[0];

  S.pick=null;sfx('card');g['h'+me].splice(i,1);g.disc=[c];g.color=c[0]==='k'?col:c[0];g.turn=-1;view();
  return go({act:'play',i,col})}

    if(a==='share'){const u=location.origin+'/r/'+S.code;
      if(navigator.share)navigator.share({title:'Main Velour',text:'Gabung room '+S.code,url:u}).catch(()=>{});
      else{await navigator.clipboard.writeText(u);toast('Link disalin')}return}
    if(a==='hand')return go({act:'hand',n:+t.dataset.n});
    if(a==='ready')return go({act:'ready'});
    if(a==='play')return play(+t.dataset.i);
    if(a==='col')return play(S.pick,t.dataset.c);
    if(a==='cancel'){S.pick=null;return view()}
    if(a==='draw'){sfx('draw');if(S.room?.g){S.room.g.turn=-1;view()}return go({act:'draw'})}
    if(a==='next')return go({act:'next'});
    if(a==='hide'){S.hide=1;return view()}
    if(a==='show'){S.hide=0;return view()}
  }catch(err){if(start){cleanup();home()}toast(err.message)}};

setInterval(()=>{const R=S.R;if(S.host&&R&&R.status==='playing'&&Date.now()>R.g.dl){auto(R);bcast()}},400);
setInterval(()=>{if(S.host&&S.gh&&S.R?.p[1])S.gh.publish('hb',{}).catch(()=>{})},4000);
setInterval(()=>{if(S.code&&!S.host&&S.last&&Date.now()-S.last>15000)roomClosed()},3000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)S.last=Date.now()});
home();
</script>
</body>
</html>
