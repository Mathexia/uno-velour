<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#0a0c0d;--ink:#f2ede3;--mut:#a39e90;--gold:#d9bb7f;--r:#e0584f;--y:#e9b949;--g:#3da57f;--b:#4b82d9;--k:#2b2b33}

body::before,body::after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.33;z-index:-1;animation:drift 22s ease-in-out infinite alternate}
body::before{background:#1d6a58;left:-25vmax;top:-22vmax}
body::after{background:#85652b;right:-25vmax;bottom:-25vmax;animation-delay:-9s}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.12)}}
#app{width:min(900px,100%);padding-top:2vh;animation:fade .5s both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.glass{background:linear-gradient(140deg,rgba(255,255,255,.12),rgba(255,255,255,.03));-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(255,255,255,.12);border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -12px 24px rgba(255,255,255,.02),0 24px 50px -24px #000}
.brand{text-align:center;margin:4vh 0 26px}
.brand h1{font:700 clamp(44px,9vw,72px)/1 'Cormorant Garamond',serif;letter-spacing:.14em;background:linear-gradient(180deg,#f7e8c0,#b88f45);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{color:var(--mut);letter-spacing:.32em;font-size:11px;margin-top:8px}
.panel{max-width:440px;margin:auto;padding:26px;display:grid;gap:14px}
label{font-size:12px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
input{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:15px 18px;color:var(--ink);font:600 16px Manrope;outline:0;transition:border-color .25s,box-shadow .25s}
input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(217,187,127,.14)}
.btn{position:relative;overflow:hidden;border:0;border-radius:999px;padding:15px 22px;font:800 15px Manrope;color:var(--ink);cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .3s,opacity .3s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.4;pointer-events:none}
.pri{background:linear-gradient(135deg,#f2deaa,#c39848);color:#251b09;box-shadow:0 12px 30px -12px rgba(217,187,127,.7)}
.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s}

.sec:hover{background:rgba(255,255,255,.1)}
.sm{padding:10px 18px;font-size:13px}
.or{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:13px}.or:before,.or:after{content:"";flex:1;height:1px;background:rgba(255,255,255,.12)}
.row{display:flex;gap:10px}.row input{text-align:center;letter-spacing:.5em;text-transform:uppercase;font-weight:800;font-size:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.ic{width:48px;height:48px;border-radius:16px;font-size:20px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.ic:hover{transform:translateX(-3px)}.ic:active{transform:scale(.9)}
.code{text-align:center}.code small{display:block;font-size:11px;letter-spacing:.3em;color:var(--mut)}

.chip:hover:not(:disabled){transform:translateY(-3px)}.chip:disabled{cursor:default;opacity:.7}
.chip.on{background:linear-gradient(135deg,#f2deaa,#c39848);color:#251b09;border-color:transparent}
.sk{height:14px;border-radius:8px;margin:12px 0;background:linear-gradient(90deg,rgba(255,255,255,.05) 20%,rgba(255,255,255,.17) 50%,rgba(255,255,255,.05) 80%);background-size:200% 100%;animation:sh 1.4s infinite linear}

.banner{text-align:center;padding:13px;border-radius:999px;margin-bottom:6px;font-weight:700;transition:all .3s}
.banner.me{color:var(--gold);box-shadow:0 0 0 1px rgba(217,187,127,.5),0 0 30px -6px rgba(217,187,127,.4)}
.msg{text-align:center;color:var(--mut);font-size:13px;min-height:20px;margin-bottom:14px}
.table{display:flex;justify-content:center;align-items:flex-end;gap:clamp(14px,5vw,44px);margin:10px 0 18px;flex-wrap:wrap}

.card{--w:clamp(50px,9.5vw,80px);width:var(--w);height:calc(var(--w)*1.46);position:relative;flex:none;border-radius:16px;border:1px solid rgba(255,255,255,.35);color:#fff;display:grid;place-items:center;font:700 calc(var(--w)*.46) 'Cormorant Garamond',serif;cursor:default;
background:radial-gradient(120% 80% at 20% 0,rgba(255,255,255,.5),transparent 45%),linear-gradient(150deg,color-mix(in srgb,var(--c) 78%,transparent),color-mix(in srgb,var(--c) 45%,#000));
-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -10px 18px rgba(0,0,0,.25),0 14px 24px -12px #000;transition:transform .28s cubic-bezier(.3,1.5,.5,1),filter .25s,box-shadow .25s}
.card b{text-shadow:0 2px 8px rgba(0,0,0,.4);font-weight:700}

.card.no{filter:saturate(.35) brightness(.55)}
.card.wild{background:radial-gradient(120% 80% at 20% 0,rgba(255,255,255,.5),transparent 45%),conic-gradient(from 30deg,#c9453f,#d9a63a,#2f9570,#3f72c4,#c9453f)}

.card.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(1.5) rotate(-12deg);opacity:0}}
.cur{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c)}
.draw{display:block;margin:0 auto 20px}
.hand{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding-top:20px}
.hh{display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(5,6,6,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;z-index:5;animation:fade .3s both}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{height:64px;border-radius:18px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(150deg,color-mix(in srgb,var(--c) 85%,transparent),color-mix(in srgb,var(--c) 50%,#000));cursor:pointer;box-shadow:inset 0 1px 1px rgba(255,255,255,.5);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

}

<script src="https://cdn.ably.com/lib/ably.min-3.js"></script>
<script type="module">
const $=s=>document.querySelector(s),app=$('#app');
const lab=v=>({S:'⊘',R:'⇄',D:'+2',W:'✦',F:'+4'}[v]||v);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CN={r:'Merah',y:'Kuning',g:'Hijau',b:'Biru'};
// ====== ISI DENGAN API KEY ABLY KAMU ======
const ABLY_KEY='1T0blg.woYYRA:u5l0dTBwnVg9Sz7vgrwTUeHcIrtAFufVq21zR53vBVU';
// ==========================================
const S={code:null,slot:null,room:null,pick:null,v:0,dl:0,dur:30,seen:null,uno:0,gn:0,np:1,hide:0,lr:-1,host:false,R:null,rt:null,ch:null,gh:null,lob:null,matched:false,jres:null,hostCid:null};
const CID=localStorage.v_cid||(localStorage.v_cid=Math.random().toString(36).slice(2,10));

// ===== Mesin game (dijalankan di browser pemilik room) =====
const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',rc=()=>Array.from({length:4},()=>AL[Math.random()*AL.length|0]).join('');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const mkDeck=()=>{const d=[];for(const c of'rygb'){d.push(c+'0');for(let v=1;v<=9;v++)d.push(c+v,c+v);for(const s of'SRD')d.push(c+s,c+s)}for(let i=0;i<4;i++)d.push('kW','kF');return shuffle(d)};
const fail=m=>{throw new Error(m)};
const BAN=['mntn','ptri','ainayah','arifah'],bad=n=>{const s=String(n).toLowerCase().replace(/[^a-z]/g,'');return BAN.some(w=>s.includes(w))};
const NOPE='Nama tidak dapat digunakan. Gunakan nama lain.';
const okc=(c,h,col,t)=>c[0]==='k'?(c[1]!=='F'||!h.some(x=>x[0]===col)):(c[0]===col||c[1]===t[1]);
function setTurn(g){const h=g['h'+g.turn],t=g.disc[g.disc.length-1];g.dur=h.some(c=>okc(c,h,g.color,t))?30:10;g.dl=Date.now()+g.dur*1000}
function startRound(R){
  const n=R.hand,d=mkDeck(),h0=d.splice(0,n),h1=d.splice(0,n);
  const top=d.splice(d.findIndex(c=>c[0]!=='k'&&/\d/.test(c[1])),1)[0],r=(R.g?.r||0)+1;
  R.status='playing';
  R.g={deck:d,disc:[top],h0,h1,color:top[0],turn:r%2?0:1,r,n:(R.g?.n||0)+1,uno:R.g?.uno||0,k:'s',by:-1,msg:'Ronde '+r+' dimulai'};
  setTurn(R.g);R.p[0].ready=R.p[1].ready=false}
function take(g,pl,n){const h=g['h'+pl];
  for(let k=0;k<n;k++){if(!g.deck.length){const t=g.disc.pop();g.deck=shuffle(g.disc);g.disc=[t];if(!g.deck.length)break}h.push(g.deck.pop())}}
function auto(R){const g=R.g,pl=g.turn;take(g,pl,1);g.turn=1-pl;g.n++;g.k='t';g.by=pl;g.msg=R.p[pl].n+' kehabisan waktu — kartu diambil otomatis';setTurn(g)}
function hplay(R,me,b){
  const g=R.g,op=1-me;if(R.status!=='playing'||g.turn!==me)fail('Bukan giliranmu');
  const h=g['h'+me],i=+b.i,c=h[i],top=g.disc[g.disc.length-1];
  if(!c)fail('Kartu tidak ada');
  if(!okc(c,h,g.color,top))fail('Kartu tidak cocok');
  if(c[0]==='k'&&!CN[b.col])fail('Pilih warna dulu');
  h.splice(i,1);g.disc.push(c);g.color=c[0]==='k'?b.col:c[0];
  const nm=R.p[me].n,on=R.p[op].n,v=c[1];let next=op,m=`${nm} main ${lab(v)}`;
  if(v==='S'||v==='R'){next=me;m+=` — ${on} dilewati`}
  if(v==='D'){take(g,op,2);next=me;m+=` — ${on} ambil 2`}
  if(v==='F'){take(g,op,4);next=me;m+=` — ${on} ambil 4`}
  if(c[0]==='k')m+=` (${CN[b.col]})`;
  g.turn=next;g.msg=m;g.n++;g.k='p';g.by=me;
  if(h.length<=1)g.uno=(g.uno||0)+1;
  if(!h.length){g.win=me;g.msg=nm+' kehabisan kartu';R.status='over';R.p[me].w++}else setTurn(g)}
function mkView(R,me){
  const o={status:R.status,hand:R.hand,v:R.v,rand:!!R.rand,p:{}};
  for(const i of[0,1])if(R.p[i])o.p[i]={n:R.p[i].n,ready:R.p[i].ready,w:R.p[i].w};
  const g=R.g,op=1-me;
  if(g){o.g={disc:[g.disc[g.disc.length-1]],color:g.color,turn:g.turn,msg:g.msg,win:g.win,r:g.r,n:g.n,k:g.k,by:g.by,uno:g.uno,dur:g.dur,left:g.dl-Date.now(),nd:g.deck.length,h:[...g['h'+me]],no:g['h'+op].length};
    if(R.status==='over')o.g.oh=[...g['h'+op]]}

function bcast(){const R=S.R;if(!R)return;R.v++;apply(mkView(R,0));if(R.p[1]&&S.gh)S.gh.publish('view',{to:R.p[1].cid,from:CID,d:mkView(R,1)})}
function hostAct(me,b){
  const R=S.R;if(!R)return;
  try{const A=b.act;
    if(A==='hand'){const n=+b.n;if(me===0&&R.status==='lobby'&&n>=5&&n<=10)R.hand=n}
    else if(A==='ready'){if(R.status==='lobby'&&R.p[1]){R.p[me].ready=!R.p[me].ready;if(R.p[0].ready&&R.p[1].ready)startRound(R)}}
    else if(A==='play')hplay(R,me,b);
    else if(A==='draw'){const g=R.g;if(R.status==='playing'&&g.turn===me){take(g,me,1);g.turn=1-me;g.msg=R.p[me].n+' mengambil kartu';g.n++;g.k='d';g.by=me;setTurn(g)}}
    else if(A==='next'){if(me===0&&R.status==='over')startRound(R)}
    else if(A==='leave'&&me===1&&R.status==='lobby'){delete R.p[1];R.p[0].w=0;R.p[0].ready=false;delete R.g}
    else if(A==='lobby'){if(R.status!=='lobby'){R.status='lobby';R.p[0].ready=false;if(R.p[1])R.p[1].ready=false}}
  }catch(e){}
  bcast()}
function onJoin(m){
  const d=m.data,R=S.R;if(!R)return;
  if(bad(d.name))return S.gh.publish('deny',{to:d.cid,m:NOPE});
  if(R.p[1]&&R.p[1].cid!==d.cid)return S.gh.publish('deny',{to:d.cid,m:'Room sudah penuh'});
  if(!R.p[1]){if(R.status!=='lobby')return S.gh.publish('deny',{to:d.cid,m:'Room sedang main'});
    R.p[1]={n:String(d.name||'').slice(0,10),cid:d.cid,ready:false,w:0};if(R.rand)startRound(R)}
  bcast()}

const go=async b=>{if(S.host)hostAct(0,b);else await S.ch.publish('act',{cid:CID,...b})};
const connect=()=>{if(S.rt)return;
  S.rt=AblyPubSub.createClient({key:ABLY_KEY,clientId:CID});
  S.rt.connection.on(c=>{console.log('ably',c.current,c.reason&&c.reason.message);
    if(c.current==='failed'||c.current==='suspended')toast('Koneksi Ably '+c.current+(c.reason?': '+c.reason.message:''))})};
function cleanup(){
  for(const c of[S.ch,S.gh])if(c){c.unsubscribe();c.presence.unsubscribe();c.detach().catch(()=>{})}
  S.ch=S.gh=null;S.R=null;S.host=false;S.code=null;S.room=null;S.jres=null}
async function hostRoom(name,rand){
  connect();const code=rc();
  S.R={status:'lobby',hand:7,rand:!!rand,v:0,p:{0:{n:name,ready:false,w:0}}};
  S.host=true;S.slot=0;S.code=code;S.ch=S.rt.channels.get('h:'+code);S.gh=S.rt.channels.get('g:'+code);
  await S.ch.subscribe('join',onJoin);
  await S.ch.subscribe('act',m=>{if(S.R?.p[1]&&m.data.cid===S.R.p[1].cid)hostAct(1,m.data)});
  S.ch.presence.subscribe('leave',m=>{const R=S.R;if(R?.p[1]&&m.clientId===R.p[1].cid&&R.status==='lobby'){delete R.p[1];R.p[0].w=0;R.p[0].ready=false;delete R.g;bcast()}});
  S.ch.presence.enter({role:'host'}).catch(()=>{})}
async function joinRoom(code,name){
  connect();code=code.toUpperCase();S.host=false;S.slot=1;S.code=code;S.last=Date.now();
  S.ch=S.rt.channels.get('h:'+code);S.gh=S.rt.channels.get('g:'+code);
  const first=new Promise((ok,no)=>{S.jres={ok,no}});
  await S.gh.subscribe('view',m=>{if(m.data.to!==CID)return;S.hostCid=m.data.from;S.last=Date.now();apply(m.data.d);S.jres?.ok()});
  await S.gh.subscribe('deny',m=>{if(m.data.to===CID)S.jres?.no(new Error(m.data.m))});
  await S.gh.subscribe('closed',()=>roomClosed());
  await S.gh.subscribe('hb',()=>{S.last=Date.now()});
  S.ch.presence.subscribe('leave',m=>{if(S.hostCid&&m.clientId===S.hostCid)roomClosed()}).catch(()=>{});
  S.ch.presence.enter({role:'guest'}).catch(()=>{});
  const hello=()=>S.ch&&S.ch.publish('join',{cid:CID,name}).catch(()=>{});
  await S.ch.publish('join',{cid:CID,name});
  const retry=setTimeout(hello,2500);
  try{await Promise.race([first,new Promise((_,no)=>setTimeout(()=>no(new Error('Room tidak ditemukan atau pemiliknya sudah keluar')),7000))])}
  finally{clearTimeout(retry)}}
function begin(showCode){S.v=0;S.seen=null;S.hide=0;if(showCode)history.pushState(0,'','/r/'+S.code);S.host?bcast():view()}
function roomClosed(){if(!S.code)return;toast('Pemilik room keluar, room ditutup');leave(true)}
async function stopSeek(){S.matched=true;const L=S.lob;S.lob=null;if(L){L.unsubscribe();L.presence.unsubscribe();await L.presence.leave().catch(()=>{});L.detach().catch(()=>{})}}
async function seek(n){
  connect();const L=S.lob=S.rt.channels.get('v-lobby');S.matched=false;
  await L.subscribe('invite',async m=>{
    if(m.data.to!==CID||S.matched)return;S.matched=true;
    try{await stopSeek();await joinRoom(m.data.code,n);begin(false)}catch(e){cleanup();home();toast(e.message)}});
  const tryMatch=async()=>{
    if(S.matched||!S.lob)return;
    const mem=(await L.presence.get()).filter(x=>x.data?.seek).sort((a,b)=>a.clientId<b.clientId?-1:1);
    const i=mem.findIndex(x=>x.clientId===CID);if(i<0||i%2||!mem[i+1])return;
    S.matched=true;
    try{await hostRoom(n,true);await L.publish('invite',{to:mem[i+1].clientId,code:S.code});await stopSeek();begin(false)}catch(e){cleanup();home();toast(e.message)}};
  L.presence.subscribe('enter',tryMatch);L.presence.subscribe('leave',tryMatch);
  await L.presence.enter({seek:1});tryMatch()}

let unoBuf;
function loadUno(){if(unoBuf||loadUno.l)return;loadUno.l=1;fetch(UNO_URI).then(r=>r.arrayBuffer()).then(b=>ac().decodeAudioData(b)).then(b=>{unoBuf=b}).catch(()=>{loadUno.l=0})}
function shout(){if(mute||!unoBuf)return 0;const s=AC.createBufferSource(),g=AC.createGain();s.buffer=unoBuf;g.gain.value=1.5;s.connect(g).connect(MG);s.start();return unoBuf.duration}
function fan(){[[0,.28],[.3,.28],[.6,1.3]].forEach(([w,d],i)=>{const ch=i<2?[261.6,329.6,392]:[523.3,659.3,784,1046.5];ch.forEach(f=>{tn(f,d,'sawtooth',.16,w);tn(f/2,d,'square',.1,w)})})}
function sad(){[[392,0],[370,.4],[349,.8],[311,1.2]].forEach(([f,w],i)=>tn(f,i<3?.38:.9,'sawtooth',.2,w))}
function flash(){const d=document.createElement('div');d.className='uf';d.textContent='UNO!';document.body.append(d);setTimeout(()=>d.remove(),1300)}
function sfx(k){if(mute&&k!=='uno')return;if(!mute)ac();
  ({card(){tn(520,.12,'triangle',.4);tn(780,.14,'sine',.25,.03)},
   draw(){tn(300,.16,'sawtooth',.14);tn(210,.18,'sawtooth',.14,.07)},
   tick(){tn(1000,.06,'square',.09)},hot(){tn(1500,.08,'square',.14)},
   join(){tn(660,.22,'sine',.3);tn(880,.28,'sine',.25,.12)},
   win(){flash();const d=shout();setTimeout(fan,(d+.12)*1000)},
   lose(){flash();const d=shout();setTimeout(sad,(d+.12)*1000)},
   uno(){flash();shout()}})[k]?.()}
$('#snd').classList.toggle('off',mute);
$('#snd').onclick=()=>{mute=!mute;localStorage.v_mute=mute?1:0;ac();MG.gain.value=mute?0:1.6;$('#snd').classList.toggle('off',mute)};
['pointerdown','touchend','keydown'].forEach(e=>addEventListener(e,unlock,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AC)AC.resume().catch(()=>{})});

// Efek suara dari perubahan state (aksi lawan, UNO, hasil)
function fx(d){
  const g=d.g,me=S.slot,np=d.p[1]?2:1;
  if(S.seen){
    if(np>S.np)sfx('join');
    if(g){
      if(g.uno>S.uno&&d.status!=='over')sfx('uno');
      if(g.n!==S.gn){
        if(d.status==='over')sfx(g.win===me?'win':'lose');
        else if(g.by!==me||g.k==='t')sfx(g.k==='p'?'card':'draw')}}}
  S.seen=1;S.np=np;if(g){S.uno=g.uno||0;S.gn=g.n}}

function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast glass';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2600)}
const myName=()=>{const n=($('#nm')?.value||localStorage.v_name||'').trim().slice(0,10);if(n)localStorage.v_name=n;return n};

function home(msg){
  const pre=(location.pathname.match(/^\/r\/([A-Za-z0-9]{4})/)||[])[1]?.toUpperCase()||'';
  app.innerHTML=`<div class="brand"><h1>VELOUR</h1><p>UNO ONLINE · DUA PEMAIN</p></div>
  <div class="glass panel"><label for="nm">Nama panggilanmu</label>
  <input id="nm" maxlength="10" placeholder="mis. Ghaniy" value="${esc((localStorage.v_name||'').slice(0,10))}" autocomplete="off">
  <button class="btn pri" data-a="create">Buat room baru</button>
  <button class="btn sec" data-a="random">🎲 Cari lawan acak</button>
  <div class="or">atau punya kode?</div>
  <div class="row"><input id="cd" maxlength="4" placeholder="••••" value="${pre}"><button class="btn sec" data-a="join">Gabung</button></div>
  ${pre?`<p style="text-align:center;color:var(--mut);font-size:13px">Kode ${pre} siap — isi nama lalu tekan Gabung.</p>`:''}
  ${msg?`<div class="sk"></div><p style="text-align:center;color:var(--mut)">${msg}</p>${msg.startsWith('Mencari')?'<button class="btn sec sm" data-a="stopseek">Batal</button>':''}`:''}</div>`;
  $('#cd').oninput=e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  $('#cd').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.length===4){e.preventDefault();app.querySelector('[data-a=join]').click()}};
}

function apply(d){
  if(!d||d.v===undefined||d.v<S.v)return;
  S.v=d.v;const me=S.slot,g=d.g;
  if(g){g.deck=Array(g.nd).fill(0);g['h'+(1-me)]=g.oh||Array(g.no).fill(0);g['h'+me]=g.h||[];S.dl=Date.now()+g.left;S.dur=g.dur||30}
  fx(d);if(d.status!=='over')S.hide=0;
  S.room=d;view()}
async function leave(skip){
  if(S.code&&!skip){try{if(S.host)await S.gh.publish('closed',{});else await S.ch.publish('act',{cid:CID,act:'leave'})}catch(e){}}
  cleanup();history.pushState(0,'','/');home()}
// Timer: tampilan lokal; waktu habis ditegakkan server
setInterval(()=>{
  const R=S.room,t=$('#tm');if(!R||!R.g||R.status!=='playing'||!t)return;
  const ms=Math.max(0,S.dl-Date.now()),rem=Math.ceil(ms/1000),my=R.g.turn===S.slot;
  t.querySelector('span').textContent=rem;t.style.setProperty('--p',ms/(S.dur*10));
  t.classList.toggle('hot',rem<=5);t.classList.toggle('mine',my);
  if(rem!==S.lr){S.lr=rem;if(rem>0&&(my||rem<=5))sfx(rem<=5?'hot':'tick')}},250);

function view(){const R=S.room;if(!R)return;R.status==='lobby'?lobby(R):game(R)}

function lobby(R){
  const me=S.slot,host=me===0,p=R.p||{},P=[p[0],p[1]],opp=P[1-me],rd=R.rand,wt=rd&&!opp;
  app.innerHTML=`<div class="top"><button class="ic" data-a="back">←</button><div class="code"><small>${rd?'MODE':'KODE ROOM'}</small><b ${rd?'style="font-size:24px;letter-spacing:.12em"':''}>${rd?'LAWAN ACAK':S.code}</b></div>${rd?'<span style="width:48px"></span>':'<button class="btn sec sm" data-a="share">Bagikan</button>'}</div>
  <section class="players">${[0,1].map(i=>P[i]?`<div class="glass pl ${i===me?'me':''}"><h3>${esc(P[i].n)}${i===me?'<i>kamu</i>':''}</h3><p class="${P[i].ready?'ok':'no'}">${P[i].ready?'siap':'belum siap'}</p><span>${P[i].w||0} menang</span></div>`:`<div class="glass pl"><div class="sk w60"></div><div class="sk w40"></div><div class="sk w30"></div></div>`).join('')}</section>
  ${wt?`<div class="glass opt"><label>Mencari lawan…</label><small>Game dimulai otomatis begitu lawan ditemukan · 7 kartu per pemain.</small></div>`:
  `<div class="glass opt"><label>Kartu per pemain</label><div class="chips">${[5,6,7,8,9,10].map(n=>`<button class="chip ${R.hand==n?'on':''}" data-a="hand" data-n="${n}" ${host?'':'disabled'}>${n}</button>`).join('')}</div>${host?'':'<small>Hanya pembuat room yang bisa mengubah jumlah kartu.</small>'}</div>
  <button class="btn ${P[me]?.ready?'dng':'pri'}" style="width:100%" data-a="ready" ${opp?'':'disabled'}>${P[me]?.ready?'Batal siap':opp?'Siap main':'Menunggu lawan…'}</button>`}`}

function game(R){
  const g=R.g,me=S.slot,op=1-me,p=R.p,mine=g['h'+me]||[],oh=g['h'+op]||[],top=g.disc[g.disc.length-1];
  const live=R.status==='playing',my=live&&g.turn===me,ok=c=>okc(c,mine,g.color,top),can=mine.some(ok),won=g.win===me;
  const cd=(c,cls='',x='')=>`<button class="card ${c[0]==='k'?'wild':''} ${cls}" style="--c:var(--${c[0]})" ${x}><i>${lab(c[1])}</i><b>${lab(c[1])}</b></button>`;
  const mini=c=>`<div class="card mini ${c[0]==='k'?'wild':''}" style="--c:var(--${c[0]})"><b>${lab(c[1])}</b></div>`;
  const ms=Math.max(0,S.dl-Date.now()),rem=Math.ceil(ms/1000);
  const bn=live?(my?(can?'Giliranmu — pilih kartu':'Kamu tidak punya kartu yang cocok — silakan ambil kartu'):'Menunggu '+esc(p[op].n)+'…'):(won?'Kamu menang':'Kamu kalah');
  const res=won?'Kamu menang':'Kamu kalah';
  app.innerHTML=`<div class="top gtop"><button class="ic" data-a="lobby">←</button>
  <div class="glass score"><div class="sd me"><small>${esc(p[me].n)}</small><em>${p[me].w||0}</em></div><span style="color:var(--mut)">:</span><div class="sd op"><em>${p[op].w||0}</em><small>${esc(p[op].n)}</small></div></div>
  <div class="tm ${live&&rem<=5?'hot':''} ${my?'mine':''}" id="tm" style="--p:${live?Math.min(100,ms/(S.dur*10)):0}"><span>${live?rem:'–'}</span></div></div>
  <div class="glass banner ${my?'me':''}">${bn}</div>
  <div class="msg">${esc(g.msg||'')}</div>
  <div class="table">
    <figure>${esc(p[op].n)} · ${oh.length}${live?`<div class="fan">${oh.slice(0,10).map(()=>'<div class="card back"></div>').join('')}</div>`:`<div class="fan rev">${oh.map(mini).join('')}</div>`}</figure>
    <figure>Kartu teratas${cd(top,'pop')}<span class="cur" style="--c:var(--${g.color})" title="${CN[g.color]}"></span></figure>
    <figure>Tumpukan<div class="card back" style="font-size:26px"><b>V</b></div></figure>
  </div>
  <button class="btn sec draw ${my&&!can?'pulse':''}" data-a="draw" ${my?'':'disabled'}>Ambil kartu</button>
  <div class="hh"><span>Kartumu (${mine.length})</span><span>sisa tumpukan: ${(g.deck||[]).length}</span></div>
  <div class="hand">${mine.map((c,i)=>cd(c,my?(ok(c)?'ok':'no'):'',`data-a="play" data-i="${i}"`)).join('')}</div>
  ${!live&&S.hide?`<div class="glass resbar"><b>${res}</b><button class="btn sec sm" data-a="show">Lihat hasil</button>${me===0?'<button class="btn pri sm" data-a="next">Ronde berikutnya</button>':''}</div>`:''}
  ${S.pick!=null?`<div class="modal"><div class="glass"><h2>Pilih warna</h2><div class="cols">${'rygb'.split('').map(c=>`<button class="col" style="--c:var(--${c})" data-a="col" data-c="${c}" aria-label="${CN[c]}"></button>`).join('')}</div><button class="btn sec sm" data-a="cancel">Batal</button></div></div>`:''}
  ${!live&&!S.hide?`<div class="modal"><div class="glass res ${won?'win':'lose'}"><button class="x" data-a="hide" aria-label="Tutup">✕</button>
  <div class="medal">${won?'🏆':'😵'}</div><h2>${won?'Kamu menang!':'Kamu kalah'}</h2>
  <p class="sub">${won?'Kamu menghabiskan kartumu duluan!':esc(p[g.win].n)+' menghabiskan kartunya duluan!'}</p>
  <div class="score" style="justify-content:center"><div class="sd me"><small>${esc(p[me].n)}</small><em>${p[me].w||0}</em></div><span style="color:var(--mut)">:</span><div class="sd op"><em>${p[op].w||0}</em><small>${esc(p[op].n)}</small></div></div>
  ${me===0?'<button class="btn pri" data-a="next">Ronde berikutnya</button>':'<div class="wait">Menunggu pemilik room memulai ronde baru…</div>'}
  <button class="btn sec" data-a="shareres">Bagikan hasil</button>
  <button class="btn ghost" data-a="lobby">Kembali ke lobby</button></div></div>`:''}`}

function play(i,col){
  const R=S.room,g=R.g,me=S.slot,c=(g['h'+me]||[])[i],top=g.disc[0];
  if(!c||g.turn!==me||R.status!=='playing')return;
  if(!okc(c,g['h'+me]||[],g.color,top))return toast(c[1]==='F'?'+4 hanya boleh kalau kamu tidak punya kartu warna '+CN[g.color]:'Kartu tidak cocok');
  if(c[0]==='k'&&!col){S.pick=i;return view()}
  S.pick=null;sfx('card');g['h'+me].splice(i,1);g.disc=[c];g.color=c[0]==='k'?col:c[0];g.turn=-1;view();
  return go({act:'play',i,col})}

app.onclick=async e=>{
  const t=e.target.closest('[data-a]');if(!t||t.disabled)return;
  const a=t.dataset.a,start=['create','random','join'].includes(a);
  try{
    if(start){
      const n=myName();if(!n)return toast('Isi nama dulu ya');
      if(bad(n))return toast(NOPE);
      if(ABLY_KEY.startsWith('ISI'))return toast('Isi ABLY_KEY di index.html dulu');
      const c0=a==='join'?$('#cd').value:'';
      home(a==='join'?'Menyambungkan…':a==='create'?'Membuat room…':'Mencari lawan…');
      if(a==='create'){await hostRoom(n,false);return begin(true)}
      if(a==='join'){if(c0.length<4){home();return toast('Kode harus 4 karakter')}await joinRoom(c0,n);return begin(true)}
      return seek(n)}
    if(a==='stopseek'){await stopSeek();return home()}
    if(a==='back')return leave();
    if(a==='lobby')return go({act:'lobby'});
    if(a==='shareres'){const R=S.room,me=S.slot,op=1-me,txt=`Velour UNO — ${R.p[me].n} ${R.p[me].w||0} : ${R.p[op].w||0} ${R.p[op].n}`;
      if(navigator.share)navigator.share({title:'Velour UNO',text:txt,url:location.origin}).catch(()=>{});
      else{await navigator.clipboard.writeText(txt+' '+location.origin);toast('Hasil disalin')}return}
    if(a==='share'){const u=location.origin+'/r/'+S.code;
      if(navigator.share)navigator.share({title:'Main Velour',text:'Gabung room '+S.code,url:u}).catch(()=>{});
      else{await navigator.clipboard.writeText(u);toast('Link disalin')}return}
    if(a==='hand')return go({act:'hand',n:+t.dataset.n});
    if(a==='ready')return go({act:'ready'});
    if(a==='play')return play(+t.dataset.i);
    if(a==='col')return play(S.pick,t.dataset.c);
    if(a==='cancel'){S.pick=null;return view()}
    if(a==='draw'){sfx('draw');if(S.room?.g){S.room.g.turn=-1;view()}return go({act:'draw'})}
    if(a==='next')return go({act:'next'});
    if(a==='hide'){S.hide=1;return view()}
    if(a==='show'){S.hide=0;return view()}
  }catch(err){if(start){cleanup();home()}toast(err.message)}};

setInterval(()=>{const R=S.R;if(S.host&&R&&R.status==='playing'&&Date.now()>R.g.dl){auto(R);bcast()}},400);
setInterval(()=>{if(S.host&&S.gh&&S.R?.p[1])S.gh.publish('hb',{}).catch(()=>{})},4000);
setInterval(()=>{if(S.code&&!S.host&&S.last&&Date.now()-S.last>15000)roomClosed()},3000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)S.last=Date.now()});
home();
</script>
</body>
</html>
